name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup old artifacts (keep latest 1)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Fetching artifacts..."
          try {
            $response = gh api repos/${{ github.repository }}/actions/artifacts --paginate 2>$null | ConvertFrom-Json
            $artifacts = $response.artifacts | Sort-Object -Property created_at -Descending | Select-Object -Skip 1
            if ($artifacts.Count -gt 0) {
              Write-Host "Found $($artifacts.Count) old artifacts to delete"
              foreach ($artifact in $artifacts) {
                Write-Host "Deleting artifact: $($artifact.id) - $($artifact.name)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($artifact.id)" 2>$null
              }
              Write-Host "Cleanup completed"
            } else {
              Write-Host "No old artifacts to delete"
            }
          } catch {
            Write-Host "Cleanup skipped (no artifacts or error)"
          }
          exit 0

      - name: Get build date
        id: date
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $datetime = Get-Date -Format "yyyyMMdd_HHmmss"
          echo "date=$date" >> $env:GITHUB_OUTPUT
          echo "datetime=$datetime" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean collector.spec

      - name: Verify build output
        run: |
          dir dist
          if (Test-Path "dist\ProductCollector.exe") {
            $size = (Get-Item "dist\ProductCollector.exe").Length / 1MB
            Write-Host "Build successful! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: ProductCollector.exe not found"
            exit 1
          }

      - name: Prepare release package
        run: |
          # install_browser.bat 복사
          Copy-Item "install_browser.bat" "dist\install_browser.bat"
          # README 생성 (빌드 날짜 포함)
          @"
          ==========================================
            ProductCollector 설치 안내
          ==========================================
          빌드 날짜: ${{ steps.date.outputs.datetime }}

          1. Python 3.11 설치 (https://www.python.org/downloads/)
             - 설치 시 "Add Python to PATH" 반드시 체크!

          2. install_browser.bat 실행
             - Playwright 브라우저를 설치합니다

          3. ProductCollector.exe 실행
             - 프로그램이 시작됩니다

          ※ install_browser.bat 은 최초 1회만 실행하면 됩니다.
          "@ | Out-File -FilePath "dist\README.txt" -Encoding utf8

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ProductCollector-Windows-${{ steps.date.outputs.date }}
          path: |
            dist/ProductCollector.exe
            dist/install_browser.bat
            dist/README.txt
          retention-days: 7
