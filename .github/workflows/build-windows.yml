name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean collector.spec

      - name: Verify build output
        run: |
          dir dist
          if (Test-Path "dist\ProductCollector.exe") {
            $size = (Get-Item "dist\ProductCollector.exe").Length / 1MB
            Write-Host "Build successful! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: ProductCollector.exe not found"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductCollector-Windows
          path: dist/ProductCollector.exe
          retention-days: 30
